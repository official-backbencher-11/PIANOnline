name: Validate PIANOnline

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check drum.js
          node --check site.js
      - name: Check local HTML/CSS/JS assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          errors = []
          for html in root.glob('*.html'):
              text = html.read_text(encoding='utf-8')
              refs = re.findall(r'(?:href|src)=["\x27]([^"\x27#]+)["\x27]', text)
              for ref in refs:
                  if ref.startswith(('http://', 'https://', 'mailto:', 'javascript:', '#')): continue
                  if not (root / ref).exists(): errors.append(f'{html}: missing local reference {ref}')
          assets = {
              'app.js': re.findall(r'tunes/[^`"\x27]+', (root / 'app.js').read_text(encoding='utf-8')),
              'drum.js': re.findall(r'sounds/[^`"\x27]+', (root / 'drum.js').read_text(encoding='utf-8'))
          }
          for source, refs in assets.items():
              for ref in refs:
                  if not (root / ref).exists(): errors.append(f'{source}: missing audio asset {ref}')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print('All local HTML references and audio assets exist.')
          PY